name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  build-test-deploy:
    name: Build, test and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore RecreioMusical.sln

      - name: Build
        run: dotnet build RecreioMusical.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test RecreioMusical.sln --configuration Release --no-build

      - name: Publish
        run: >-
          dotnet publish src/RecreioMusical.Web/RecreioMusical.Web.csproj
          --configuration Release
          --output ${{ runner.temp }}/publish

      - name: Azure login (OIDC)
        if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ${{ runner.temp }}/publish
